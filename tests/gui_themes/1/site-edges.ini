; ScarletNX GUI theme, format 1: a folder of themes/ holding this file, the folder's name its id. A folder named
; like a built-in replaces it. Keys left out, or that cannot be read, keep the base's value; keys this GUI does not
; know are left for others (rEden's ErET reads the same file). A comment takes a line of its own. docs/GUI.md
; describes every key. Made with https://scarletnx.github.io/theme/
[theme]
format = 1
name = "  Edges: a name with spaces at both ends, quotes "inside", 63 b"
author = 
; ErET's drawing for it (plain | debug | loading | menu | skip); a base when no base names one
layout = skip
; default | yorha
base = default

[colors]
; the menus, #RRGGBB. soft: hints and secondary text; focus: the focused line, or its band; dim: rules
page = #0A0B0C
ink = #45413A
soft = #8A8676
focus = #45413A
active = #8A6A2A
failure = #A5473C
dim = #B4B09C
warning = #8A6A2A

[head]
; plain | bar | none; rule: a line under the head
style = none
rule = false
; the title of each screen, empty for none; a steps run's title word
menu = 
games = ;not a comment
keys = = sign
compiling = ""quoted""
loading = éé BOOT ■

[body]
; before each menu item; quotes keep spaces
marker = "■■■■■"
; the focused line: color | bar
focus = color

[footer]
; plain | bar | none; rule: a line over the footer
style = plain
rule = true

[run]
; console: the driver's output as it comes; steps: a loading screen, in the colours below
layout = console
page = #141416
ink = #E6E4DC
soft = #8E8C86
dim = #3E3E40
failure = #D2463A
; a run being aborted
warning = #D9B24A
; faint lines over the page; the progress bar and its percentage
texture = false
bar = true
; detailed: each step's other lines under it; collapse: a done step's folded away, a failed one's kept
detailed = false
collapse = true
; none | left | right | right-near-text
ring = right-near-text

[prompt]
; a line that waits on the user, when its key below is true: framed by open and close, placed left | center |
; right on its row, blinking at blink_ms (blink = false: steady). False keeps the line plain, at the left
align = right
open = """
close = "" "
blink = false
; keys: the keys screen's drop line; done and failed: the ESC line after a run; aborting: a run being aborted
keys = false
done = true
failed = true
aborting = true

[transitions]
; milliseconds, 0 to 10000; 0 turns the thing off. fade_out_ms: the menu as a run starts, and a run ESC
; leaves; fade_in_ms: what comes after
fade_in_ms = 0
fade_out_ms = 10000
; how a step's line comes in: none | typing | slide | fade
line_in = fade
line_in_ms = 10000
typing_ms = 0
; async: every line types from when it comes; sync: one at a time. A running step's newest line
; types a character each typing_ms, any other line whole in typing_ms
typing = async
blink_ms = 1
; a line too long for its row (big letters) slides left a column every scroll_ms and back; 0 cuts it
scroll_ms = 10000

[splash]
; the boot's: the program's icon on page for ms milliseconds (0: none). chance: the boots in 100 that
; show this theme's, the default theme's the others
page = #FFFFFF
ms = 0
chance = 100

; ErET's places for the ring, the boot word and the texture, the same as above
[header]
ring_side = right-near-text
[loading]
title = éé BOOT ■
[colors]
texture = false

; keys this GUI does not read, kept for the programs that do
[header]
font = big
[extra]
k = " v "
